{{- /* chezmoi:modify-template */ -}}
{{- /* Ignore Grok's own delegate skill at both discovery paths. Preserve other
     settings/ignores; normalize TOML only when migration changes the config. */ -}}
{{- $original := .chezmoi.stdin -}}
{{- $config := fromToml ($original | default "") -}}
{{- $skills := get $config "skills" | default dict -}}
{{- $previous := get $skills "ignore" | default list -}}
{{- $ignore := without $previous "~/.claude/skills/grok-review" "~/.claude/skills/grok-implementation" -}}
{{- range list "~/.agents/skills/delegate-grok" "~/.claude/skills/delegate-grok" -}}
  {{- if not (has . $ignore) -}}
    {{- $ignore = append $ignore . -}}
  {{- end -}}
{{- end -}}
{{- if ne (toJson $ignore) (toJson $previous) -}}
  {{- $_ := set $skills "ignore" $ignore -}}
  {{- $_ := set $config "skills" $skills -}}
{{ $config | toToml }}
{{ else -}}
{{ $original }}
{{- end -}}
