# Profile defaults and target ownership. Local switches live in chezmoi.toml.

[dotfiles.profiles.standalone]
desktop = false
git = true
agents = true
tools = true
runtimes = true
tools-re = false
shell = true
prompt = true
terminal = true
editor = true
packages = true

[dotfiles.profiles.omarchy]
desktop = false
git = true
agents = true
tools = true
runtimes = false
tools-re = false
shell = false
prompt = false
terminal = false
editor = false
packages = false

[dotfiles.modulePaths]
desktop = [
    ".config/hypr",
    ".config/hypr/input.lua",
    ".config/hypr/looknfeel.lua",
]
git = [
    ".config/git",
    ".gitconfig",
    ".config/git/dotfiles.gitconfig",
    ".ssh",
    ".ssh/**",
]
agents = [
    ".agents",
    ".agents/**",
    ".claude",
    ".claude/**",
    ".codex",
    ".codex/**",
    ".pi",
    ".pi/**",
    ".config/opencode",
    ".config/opencode/**",
]
tools = [
    ".config/mise",
    ".config/mise/**",
]
tools-re = [
    ".config/reverse-engineering",
    ".config/reverse-engineering/**",
    ".agents/skills/reverse-engineer-anything",
    ".agents/skills/reverse-engineer-anything/**",
    ".claude/skills/reverse-engineer-anything",
    ".codex/skills/reverse-engineer-anything",
    ".pi/agent/skills/reverse-engineer-anything",
]
runtimes = [
    ".local",
    ".local/**",
    ".default-python-packages",
    ".local/bin/python3.cmd",
]
shell = [
    ".config/fish",
    ".config/fish/**",
    ".config/shell",
    ".config/shell/**",
    ".bash_profile",
    ".bashrc",
    ".profile",
    ".zprofile",
    ".zshenv",
    ".zshrc",
    "Documents",
    "Documents/**",
]
prompt = [
    ".config/starship.toml",
]
terminal = [
    ".config/ghostty",
    ".config/ghostty/**",
    ".config/iterm2",
    ".config/iterm2/**",
    "AppData",
    "AppData/**",
    ".config/t3code",
    ".config/t3code/**",
]
editor = [
    ".editorconfig",
    ".vscode",
    ".vscode/**",
]
packages = [
    ".config/packages",
    ".config/packages/**",
]

[dotfiles.platformPaths]
darwin = [
    ".config/reverse-engineering",
    ".config/reverse-engineering/**",
    ".config/packages/Brewfile",
    ".config/iterm2",
    ".config/iterm2/**",
    ".config/mise/conf.d/github-public-ro.toml",
]
windows = [
    ".local/bin/python3.cmd",
    ".config/packages/winget.json",
    "AppData",
    "AppData/**",
    "Documents",
    "Documents/**",
]
posix = [
    ".config/fish",
    ".config/fish/**",
    ".config/shell",
    ".config/shell/**",
    ".config/ghostty",
    ".config/ghostty/**",
    ".bash_profile",
    ".bashrc",
    ".profile",
    ".zprofile",
    ".zshenv",
    ".zshrc",
]

[dotfiles.pins]
# github/gh-stack release for the gh extension, and that tag's commit for its agent skill.
ghStack = "v0.2.0"
ghStackCommit = "d4ab7ab47e5b3e3708a27c8c42abcdf4bc321419"
# REA is an optional analysis driver; its workflow skill is maintained locally.
rea = "6.8.0"
