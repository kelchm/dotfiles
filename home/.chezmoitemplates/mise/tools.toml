[tools]
{{ if eq .profile "omarchy" -}}
# Use the stock gh/OpenCode declarations on Omarchy.
gh = "latest"
opencode = { version = "latest", allow_builds = ["@opencode/cli"] }
{{ else -}}
"aqua:cli/cli" = "2.101.0"
# Explicit backend also works with older mise registries on other machines.
"npm:@opencode/cli" = { version = "latest", allow_builds = ["@opencode/cli"] }
{{ end -}}
antigravity-cli = "latest"
claude = "latest"
codex = "latest"
grok = "latest"
pi = "latest"
uv = "latest"

[settings]
minimum_release_age = "0s"

[settings.upgrade]
auto_prune = false

[env]
AGY_CLI_DISABLE_AUTO_UPDATE = "true"
DISABLE_AUTOUPDATER = "1"
OPENCODE_DISABLE_AUTOUPDATE = "1"
GROK_DISABLE_AUTOUPDATER = "1"
PI_SKIP_VERSION_CHECK = "1"

[tasks."harness:update"]
description = "Upgrade harness CLIs immediately, leaving runtimes alone"
# Keep explicit harness upgrades immediate when a local setting overrides the shared delay.
env = { MISE_MINIMUM_RELEASE_AGE = "0" }
run = "mise upgrade antigravity-cli claude codex grok {{ if eq .profile "omarchy" }}opencode{{ else }}npm:@opencode/cli{{ end }} pi"
