# GitHub's agent skill for the gh-stack extension, at the commit of the release the bootstrap installs.
# A commit, unlike a tag, always yields the same archive contents.
[".agents/skills/gh-stack"]
type = "archive"
url = "https://github.com/github/gh-stack/archive/{{ .dotfiles.pins.ghStackCommit }}.tar.gz"
stripComponents = 3
include = ["*/skills/gh-stack/**"]

{{ if and (hasKey . "modules") (index .modules "tools-re") (index .modules "agents") -}}
# Use the skill bundled with the pinned npm release, including its references.
[".agents/skills/reverse-engineer-anything"]
type = "archive"
url = "https://registry.npmjs.org/rea-agents/-/rea-agents-{{ .dotfiles.pins.rea }}.tgz"
stripComponents = 3
include = ["package/skills/reverse-engineer-anything/**"]
{{ end -}}
