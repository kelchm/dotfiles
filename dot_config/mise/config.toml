[tools]
"aqua:cli/cli" = "2.101.0"
# Harness CLIs (claude, codex, grok, opencode, pi) track latest. mise is the
# install owner on every OS.
# `chezmoi apply` runs `mise install` (fills in missing tools). Bump with
# `mise run harness:update`.
claude = "latest"
codex = "latest"
grok = "latest"
node = "lts"
# OpenCode 2 ships only as @opencode/cli; the registry's `opencode` is still 1.x.
# Its postinstall selects the native binary, so mise must be allowed to run it.
"npm:@opencode/cli" = { version = "latest", allow_builds = ["@opencode/cli"] }
pi = "latest"
python = "3.12"
uv = "latest"

[env]
# Keep background updates with mise; manual vendor commands remain available.
DISABLE_AUTOUPDATER = "1"
OPENCODE_DISABLE_AUTOUPDATE = "1"
GROK_DISABLE_AUTOUPDATER = "1"
PI_SKIP_VERSION_CHECK = "1"

[settings]
python.uv_venv_auto = true  # auto-creates/activates .venv via uv
# Let per-repo rust-toolchain.toml drive the Rust version.
idiomatic_version_file_enable_tools = ["rust"]
# Delay timestamped releases; Grok's HTTP feed has no release timestamps.
minimum_release_age = "24h"

[tasks."harness:update"]
description = "Upgrade harness CLIs to latest"
run = "mise upgrade claude codex grok npm:@opencode/cli pi"
