[tool_alias]
# Explicit backends retain short names for the update tasks below.
# Aqua recipes select the appropriate macOS/Windows release assets.
claude = "aqua:anthropics/claude-code"
codex = "aqua:openai/codex"
grok = "http:grok"
opencode = "aqua:anomalyco/opencode"
rtk = "aqua:rtk-ai/rtk"

[tools]
# Harness CLIs (claude, codex, grok, opencode) and RTK (shell-output filter,
# not an agent) track latest. mise is the install owner on every OS.
# `chezmoi apply` runs `mise install` (fills in missing tools). Bump with
# `mise run harness:update`.
claude = "latest"
codex = "latest"
grok = "latest"
node = "lts"
opencode = "latest"
python = "3.12"
rtk = "latest"
uv = "latest"

[settings]
python.uv_venv_auto = true  # auto-creates/activates .venv via uv
# Let per-repo rust-toolchain.toml drive the Rust version.
idiomatic_version_file_enable_tools = ["rust"]
# Delay timestamped releases; Grok's HTTP feed has no release timestamps.
minimum_release_age = "24h"

[tasks."harness:outdated"]
hide = true
run = "mise outdated claude codex grok opencode rtk"

[tasks."harness:update"]
description = "Upgrade harness CLIs and RTK to latest"
run = "mise upgrade claude codex grok opencode rtk"
